# Every server the benchmark runs against. Start only what a cell needs with profiles, e.g.
#   docker compose --profile pgvector --profile authz up -d
# Versions are pinned here and recorded with every run (bench/run.py writes `docker compose images`).
name: bench

services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    profiles: [pgvector]
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "maintenance_work_mem=2GB",
              "-c", "max_parallel_maintenance_workers=3", "-c", "work_mem=64MB"]
    shm_size: 2gb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: [qdrant]
    ports: ["6333:6333", "6334:6334"]

  # Standalone Milvus with its embedded etcd and local storage, as Milvus's own standalone script runs it.
  milvus:
    image: milvusdb/milvus:v3.0.5
    profiles: [milvus]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./config/milvus-embed-etcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports: ["19530:19530", "9091:9091"]

  # Weaviate's ports move off 8080 and 50051, which OpenFGA and SpiceDB use.
  weaviate:
    image: semitechnologies/weaviate:1.40.4
    profiles: [weaviate]
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
    ports: ["8090:8080", "50061:50051"]

  # The security plugin stays on (its demo certificates), because arm A5 uses document-level security.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: [opensearch]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Bench-Admin-2026!"
      OPENSEARCH_JAVA_OPTS: "-Xms4g -Xmx4g"
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    ports: ["9200:9200"]

  # One PostgreSQL holds both authorization engines' data, as a production deployment would
  # (neither engine runs on its in-memory store here).
  authzdb:
    image: postgres:17.11-trixie
    profiles: [authz]
    environment:
      POSTGRES_PASSWORD: authz
      POSTGRES_DB: spicedb
    volumes:
      - ./config/authzdb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | cut -d '|' -f1 | grep -qw openfga"]
      interval: 2s
      retries: 60

  spicedb-migrate:
    image: authzed/spicedb:v1.57.0
    profiles: [authz]
    command: ["migrate", "head", "--datastore-engine", "postgres",
              "--datastore-conn-uri", "postgres://postgres:authz@authzdb:5432/spicedb?sslmode=disable"]
    depends_on:
      authzdb: {condition: service_healthy}

  spicedb:
    image: authzed/spicedb:v1.57.0
    profiles: [authz]
    command: ["serve", "--grpc-preshared-key", "bench", "--http-enabled",
              "--datastore-engine", "postgres",
              "--datastore-conn-uri", "postgres://postgres:authz@authzdb:5432/spicedb?sslmode=disable"]
    ports: ["50051:50051", "8443:8443"]
    depends_on:
      spicedb-migrate: {condition: service_completed_successfully}

  # Fault runs (bench.faults) send the arms' engine traffic through this proxy; other runs never touch it.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [authz]
    ports: ["8474:8474", "60051:60051", "60443:60443", "60080:60080"]

  openfga-migrate:
    image: openfga/openfga:v1.22.1
    profiles: [authz]
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://postgres:authz@authzdb:5432/openfga?sslmode=disable"
    depends_on:
      authzdb: {condition: service_healthy}

  openfga:
    image: openfga/openfga:v1.22.1
    profiles: [authz]
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://postgres:authz@authzdb:5432/openfga?sslmode=disable"
      OPENFGA_PLAYGROUND_ENABLED: "false"
      # Loading only: larger write batches. Query-time limits stay at their defaults.
      OPENFGA_MAX_TUPLES_PER_WRITE: "1000"
    ports: ["8080:8080"]
    depends_on:
      openfga-migrate: {condition: service_completed_successfully}

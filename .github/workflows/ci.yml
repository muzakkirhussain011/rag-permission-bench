name: ci

# Unit tests, then the whole harness end to end on the small synthetic workload, per store.
# The synthetic numbers check the harness (bench.analyze --check), not any hypothesis.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-run.txt
      - name: Record the resolved packages
        run: pip freeze --all | tee requirements-resolved.txt
      - name: Print the installed integration code that the arms run
        run: |
          python - <<'EOF'
          import inspect, auth0_ai_langchain, langchain_spicedb
          from auth0_ai_langchain import FGARetriever
          from langchain_spicedb import retrievers, core
          print(inspect.getsource(FGARetriever))
          print(inspect.getsource(retrievers))
          print(inspect.getsource(core.SpiceDBAuthorizer.lookup_resources))
          EOF
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-resolved
          path: requirements-resolved.txt

  faults:
    needs: unit
    runs-on: ubuntu-24.04
    env:
      BENCH_SPICEDB_GRPC: localhost:60051
      BENCH_SPICEDB_HTTP: http://localhost:60443
      BENCH_OPENFGA_URL: http://localhost:60080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -r requirements-run.txt
      - run: docker compose --profile pgvector --profile authz up -d
      - run: python -m bench.devdata --out data/dev && python -m bench.truth --workload data/dev
      - run: python -m bench.faults --workload data/dev --store pgvector --out results/faults-pgvector.jsonl.gz --queries 20
      - run: python -m bench.analyze --workload data/dev --run results/faults-pgvector.jsonl.gz
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faults-dev
          path: results/

  e2e:
    needs: unit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        store: [pgvector, qdrant, milvus, weaviate, opensearch]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -r requirements-run.txt
      - name: Start the store and both engines
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose --profile ${{ matrix.store }} --profile authz up -d
      - run: python -m bench.devdata --out data/dev
      - run: python -m bench.truth --workload data/dev
      - run: python -m bench.run --workload data/dev --store ${{ matrix.store }} --out results/dev-${{ matrix.store }}.jsonl.gz ${{ matrix.store == 'pgvector' && '--partitions' || '' }}
      - run: python -m bench.analyze --workload data/dev --run results/dev-${{ matrix.store }}.jsonl.gz --check
      - name: FGARetriever checks (outside the measured arms)
        if: matrix.store == 'pgvector'
        run: python -m bench.probe_fga --workload data/dev --meta results/dev-pgvector.meta.json --out results/probe-fga.json
      - name: Permission changes, briefly (fresh servers)
        run: |
          docker compose --profile ${{ matrix.store }} --profile authz down -v
          docker compose --profile ${{ matrix.store }} --profile authz up -d
          python -m bench.churn --workload data/dev --store ${{ matrix.store }} --out results/churn-${{ matrix.store }}.jsonl.gz --events 4 --cap 20 --settle 3
      - if: always()
        run: mkdir -p results && docker compose --profile ${{ matrix.store }} --profile authz logs --no-color > results/compose.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.store }}
          path: results/
